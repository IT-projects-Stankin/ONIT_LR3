name: infra

services:
  gitea:
    image: gitea/gitea:1.27.3
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__ROOT_URL: "https://${CODESPACE_NAME}-3000.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}/"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports:
      - "3000:3000"
    volumes:
      - gitea-data:/data
    restart: unless-stopped

volumes:
  gitea-data:
