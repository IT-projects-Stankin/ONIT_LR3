name: CI/CD

on:
  push:
    branches: [main]

jobs:
  tests:
    name: Тестирование приложения
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить Python и зависимости
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r app/requirements-test.txt

      - name: Запустить тесты
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
        run: |
          cd app
          ../.venv/bin/python -m pytest -q tests

  build:
    name: Сборка Docker-образа
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить Docker CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          . /etc/os-release
          printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian %s stable\n' "$(dpkg --print-architecture)" "$VERSION_CODENAME" > /etc/apt/sources.list.d/docker.list
          apt-get update -qq
          apt-get install -y -qq docker-ce-cli docker-buildx-plugin
          docker version

      - name: Собрать приложение
        run: |
          TAG=$(git rev-parse --short=7 HEAD)
          docker build --target runtime -t "guestbook:ci-$TAG" ./app
          docker image inspect "guestbook:ci-$TAG" --format '{{.Id}}'
          echo "Образ успешно собран: guestbook:ci-$TAG"
