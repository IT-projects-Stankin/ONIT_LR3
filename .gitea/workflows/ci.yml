name: CI/CD

on:
  push:
    branches: [main]

jobs:
  check-runner:
    runs-on: ubuntu-latest

    steps:
      - name: Проверка исполнителя
        run: |
          echo "Gitea Actions работает"
          echo "Проверка окружения:"
          uname -s
          node --version
          echo "Задание выполнено успешно"
