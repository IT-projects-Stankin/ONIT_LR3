name: CI/CD

on:
  push:
    branches: [main]

jobs:
  tests:
    name: Тестирование приложения
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить Python и зависимости
        run: |
          apt-get update -qq
          apt-get install -y -qq python3 python3-venv
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r app/requirements-test.txt

      - name: Запустить тесты
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
        run: |
          cd app
          ../.venv/bin/python -m pytest -q tests

  build:
    name: Сборка Docker-образа
    needs: tests
    runs-on: ubuntu-latest

    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Подготовить Docker CLI
        run: |
          apt-get update -qq
          apt-get install -y -qq ca-certificates curl
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          . /etc/os-release
          printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian %s stable\n' "$(dpkg --print-architecture)" "$VERSION_CODENAME" > /etc/apt/sources.list.d/docker.list
          apt-get update -qq
          apt-get install -y -qq docker-ce-cli docker-buildx-plugin docker-compose-plugin
          docker version

      - name: Собрать приложение
        run: |
          TAG=$(git rev-parse --short=7 HEAD)
          docker build --target runtime --build-arg APP_VERSION="$TAG" -t "guestbook:ci-$TAG" ./app
          docker image inspect "guestbook:ci-$TAG" --format '{{.Id}}'
          echo "Образ успешно собран: guestbook:ci-$TAG"

      - name: Опубликовать образ в Gitea Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          set -eu

          if [ -z "${REGISTRY_TOKEN:-}" ]; then
            echo "Не найден секрет REGISTRY_TOKEN"
            exit 1
          fi

          TAG=$(git rev-parse --short=7 HEAD)
          IMAGE="localhost:3000/student/guestbook"

          umask 077
          DOCKER_CONFIG=$(mktemp -d)
          export DOCKER_CONFIG
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          AUTH=$(printf 'student:%s' "$REGISTRY_TOKEN" | base64 | tr -d '\n')
          printf '{"auths":{"localhost:3000":{"auth":"%s"}}}\n' "$AUTH" > "$DOCKER_CONFIG/config.json"

          docker tag "guestbook:ci-$TAG" "$IMAGE:$TAG"
          docker tag "guestbook:ci-$TAG" "$IMAGE:latest"

          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"

          echo "Образы опубликованы: $TAG и latest"

      - name: Развернуть новую версию
        run: |
          set -eu
          TAG=$(git rev-parse --short=7 HEAD)
          export APP_IMAGE="localhost:3000/student/guestbook:$TAG"

          echo "Развёртывание версии $TAG"
          docker compose version
          ./deploy.sh
          docker compose ps app
